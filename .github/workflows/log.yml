name: log-signals

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: log-signals
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run logger
        run: python logger.py
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHANNEL: "Secret_Quotex_Bot"
          SIGNAL_TZ_OFFSET: "6"

      - name: Commit data
        run: |
          git config user.name "logger-bot"
          git config user.email "logger-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "update signals" && git push)
